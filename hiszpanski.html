<script>
'use strict';
// ====================== DANE: PLAN 52 TYGODNIE (A1→B2) ======================
// [tytuł tygodnia, temat gramatyki, notatka, temat słownictwa, "es=pl;es=pl;..."]
const WEEKS=[
// ---------- A1 (tyg. 1–12) ----------
["Hola, mundo","Alfabet i wymowa",`Hiszpański czyta się tak, jak się pisze.
• **j** = twarde „ch” (jamón), **h** jest nieme (hola → „ola”), **ll** ≈ „j/dż” (calle), **ñ** = „ń” (España), **qu** = „k” (queso), **v** = „b”.
• **c/z** przed e, i = „th” (Hiszpania) lub „s” (Ameryka): gracias, cena.
• Akcent pada na przedostatnią sylabę, gdy słowo kończy się na samogłoskę, -n, -s; w pozostałych przypadkach na ostatnią. Odstępstwo zaznacza kreska: café, está.
• Pytania i wykrzyknienia mają odwrócony znak na początku: ¿Cómo estás? ¡Hola!`,"Powitania i pierwsze słowa","hola=cześć;adiós=do widzenia;buenos días=dzień dobry (rano);buenas tardes=dzień dobry (po południu);buenas noches=dobry wieczór / dobranoc;por favor=proszę;gracias=dziękuję;de nada=nie ma za co;sí=tak;no=nie;perdón=przepraszam;mucho gusto=miło mi poznać;¿cómo estás?=jak się masz?;bien=dobrze;hasta luego=do zobaczenia"],
["Me llamo…","Czasownik SER",`**Ser** = być (cechy stałe: tożsamość, narodowość, zawód).
yo **soy** · tú **eres** · él/ella/usted **es** · nosotros **somos** · vosotros **sois** · ellos/ustedes **son**
• Soy Marcel. Soy polaco.
• ¿De dónde eres? — Soy de Polonia.
Zaimków osobowych zwykle nie używasz, bo końcówka mówi, kto robi: „Soy polaco”, nie „Yo soy polaco” (chyba że podkreślasz).
Imię: ¿Cómo te llamas? — Me llamo…`,"Kraje, narodowości, zawody","el nombre=imię / nazwa;me llamo=nazywam się;¿cómo te llamas?=jak masz na imię?;Polonia=Polska;España=Hiszpania;polaco/polaca=Polak / Polka;español/española=Hiszpan / Hiszpanka;el país=kraj;el estudiante=student;el profesor=nauczyciel;el médico=lekarz;el trabajo=praca;¿de dónde eres?=skąd jesteś?;ser de=być z"],
["Rodzaj i liczba","Rzeczowniki, el/la, un/una",`Rzeczowniki mają rodzaj. Zwykle **-o** = męski (el libro), **-a** = żeński (la casa). Wyjątki: el día, el mapa, la mano. Końcówki -ción, -dad = żeński (la estación, la ciudad).
Liczba mnoga: samogłoska + **s** (casa → casas), spółgłoska + **es** (ciudad → ciudades), -z → -ces (lápiz → lápices).
Rodzajniki określone: el, la, los, las. Nieokreślone: un, una, unos, unas.
Zawsze ucz się słówka razem z rodzajnikiem!`,"Dom, rzeczy, miejsca","el libro=książka;la casa=dom;el coche=samochód;la mesa=stół;la silla=krzesło;la ciudad=miasto;el día=dzień;la calle=ulica;el teléfono=telefon;la mochila=plecak;el perro=pies;el amigo/la amiga=przyjaciel / przyjaciółka"],
["Estoy aquí","Czasownik ESTAR",`**Estar** = być (położenie, stan chwilowy, samopoczucie).
yo **estoy** · tú **estás** · él **está** · nosotros **estamos** · vosotros **estáis** · ellos **están**
• Estoy en casa. • Ella está cansada. • ¿Cómo estás? — Estoy bien.
**Ser vs estar:** ser = kim/jaki jesteś (z natury), estar = gdzie jesteś / jak się masz teraz.
Liczby 0–10: cero, uno, dos, tres, cuatro, cinco, seis, siete, ocho, nueve, diez.`,"Stany, miejsca, liczby 0–10","cansado/cansada=zmęczony / zmęczona;contento/contenta=zadowolony / zadowolona;aquí=tutaj;allí=tam;en=w / na;cerca=blisko;lejos=daleko;uno=jeden;dos=dwa;tres=trzy;cuatro=cztery;cinco=pięć;seis=sześć;siete=siedem;ocho=osiem;nueve=dziewięć;diez=dziesięć;cero=zero"],
["Mi día","Presente: czasowniki -AR",`Końcówki -ar: **-o, -as, -a, -amos, -áis, -an**.
hablar: hablo, hablas, habla, hablamos, habláis, hablan.
• Hablo un poco de español. • Trabajo en Varsovia. • ¿Estudias mucho?
Przeczenie: **no** przed czasownikiem — No hablo inglés.
Pytanie: ta sama kolejność co w zdaniu oznajmującym + intonacja i ¿…?`,"Codzienne czynności (-ar)","hablar=mówić;trabajar=pracować;estudiar=uczyć się;caminar=chodzić / iść;comprar=kupować;cocinar=gotować;escuchar=słuchać;mirar=patrzeć;necesitar=potrzebować;bailar=tańczyć;viajar=podróżować;llamar=dzwonić / wołać"],
["Comer y vivir","Presente: -ER i -IR",`**-er**: -o, -es, -e, -emos, -éis, -en (comer: como, comes, come, comemos, coméis, comen).
**-ir**: -o, -es, -e, -imos, -ís, -en (vivir: vivo, vives, vive, vivimos, vivís, viven).
• Como pan con queso. • Vivo en Polonia. • ¿Qué bebes?
Różnica -er/-ir tylko w „nosotros” i „vosotros”.`,"Jedzenie i picie","comer=jeść;beber=pić;vivir=mieszkać / żyć;escribir=pisać;leer=czytać;abrir=otwierać;el pan=chleb;el agua=woda;el café=kawa;la leche=mleko;la carne=mięso;la fruta=owoc;la sopa=zupa;la cerveza=piwo"],
["Mi familia","Czasownik TENER",`**Tener** = mieć: tengo, tienes, tiene, tenemos, tenéis, tienen.
• Tengo veinte años (wiek: „mam lat”). • Tengo hambre / sed / frío / calor / sueño. • Tengo una hermana.
**tener que + bezokolicznik** = musieć: Tengo que trabajar.
Liczby 11–20: once, doce, trece, catorce, quince, dieciséis, diecisiete, dieciocho, diecinueve, veinte.`,"Rodzina i wiek","la familia=rodzina;el padre=ojciec;la madre=matka;el hermano/la hermana=brat / siostra;el hijo/la hija=syn / córka;el abuelo/la abuela=dziadek / babcia;el marido=mąż;la mujer=żona / kobieta;el año=rok;tener hambre=być głodnym;tener sed=chcieć pić;tener que=musieć"],
["¿Cómo es?","Przymiotniki: zgodność",`Przymiotnik zgadza się z rzeczownikiem w rodzaju i liczbie: un chico alto, una chica alta, chicos altos, chicas altas.
Na -e lub spółgłoskę nie zmienia rodzaju: grande, fácil, joven (mnoga: grandes).
Zwykle stoi **po** rzeczowniku: una casa grande.
• Mi hermana es simpática y muy inteligente.
Bardzo = **muy**; trochę = **un poco**.`,"Opis osób i rzeczy, kolory","alto/alta=wysoki / wysoka;bajo/baja=niski / niska;guapo/guapa=ładny / ładna;simpático/simpática=sympatyczny / sympatyczna;grande=duży;pequeño/pequeña=mały / mała;nuevo/nueva=nowy / nowa;viejo/vieja=stary / stara;rojo=czerwony;azul=niebieski;verde=zielony;negro=czarny;blanco=biały;muy=bardzo"],
["Mi casa","Hay vs estar",`**Hay** = jest / są (istnienie, coś nowego): Hay un banco cerca. Hay dos camas.
**Estar** = gdzie jest coś konkretnego, znanego: El banco está en la calle Mayor.
Przyimki miejsca: en, sobre, debajo de, delante de, detrás de, al lado de, entre, a la derecha / izquierda de.
Po „hay” nie dajesz rodzajnika określonego: Hay **un** libro / Hay libros (nie „hay el libro”).`,"Dom i meble","la cocina=kuchnia;el baño=łazienka;el dormitorio=sypialnia;el salón=salon;la cama=łóżko;el sofá=kanapa;la ventana=okno;la puerta=drzwi;la habitación=pokój;el piso=mieszkanie;debajo de=pod;encima de=nad / na;al lado de=obok;delante de=przed;detrás de=za"],
["¿Adónde vas?","IR, HACER i ir a + bezokolicznik",`**Ir** = iść / jechać: voy, vas, va, vamos, vais, van. **Hacer** = robić: hago, haces, hace, hacemos, hacéis, hacen.
• Voy a casa. • Voy al cine (a + el = **al**). • ¿Qué haces?
**ir a + bezokolicznik** = zamierzać, bliska przyszłość: Voy a comer. Vamos a viajar mañana.

["De compras","Zmiana rdzenia (e→ie, o→ue)",`**e→ie**: querer (quiero, quieres, quiere, queremos, queréis, quieren), preferir, empezar.
**o→ue**: poder (puedo, puedes, puede, podemos, podéis, pueden), dormir, volver.

Liczby: veinte, treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien. Cena: ¿Cuánto cuesta? Cuesta cinco euros.`,"Zakupy i ceny","la tienda=sklep;el supermercado=supermarket;el precio=cena;¿cuánto cuesta?=ile kosztuje?;caro/cara=drogi / droga;barato/barata=tani / tania;el dinero=pieniądze;la tarjeta=karta;pagar=płacić;querer=chcieć / kochać;poder=móc;la bolsa=torba / torebka;el euro=euro;la cuenta=rachunek"],
["¿Qué hora es?","Godziny, dni, miesiące",`Godzina: ¿Qué hora es? — Es **la** una. Son **las** dos y media. Son las tres menos cuarto. O której? — **A las** ocho.
Dni tygodnia (małą literą): lunes, martes, miércoles, jueves, viernes, sábado, domingo. „W poniedziałek” = el lunes.
Miesiące: enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre.
Data: Es el 8 de noviembre.
Dzień 7 to jednocześnie test całego A1: ser / estar / tener / ir / hacer, presente, rodzaj i liczba, hay, godziny. Cel: swobodnie przedstawić się, zamówić kawę, zapytać o drogę i godzinę.`,"Czas, kalendarz i zwroty A1","la hora=godzina;el minuto=minuta;lunes=poniedziałek;martes=wtorek;miércoles=środa;jueves=czwartek;viernes=piątek;sábado=sobota;domingo=niedziela;hoy=dzisiaj;mañana=jutro;ayer=wczoraj;el mes=miesiąc;la semana=tydzień;no entiendo=nie rozumiem;más despacio=wolniej;¿cómo se dice…?=jak się mówi…?;¿qué significa?=co to znaczy?;no sé=nie wiem;¿dónde está…?=gdzie jest…?"],

["Ayer fui…","Pretérito indefinido: regularne",`Przeszły dokonany (zdarzenie zakończone). **-ar**: -é, -aste, -ó, -amos, -asteis, -aron. **-er/-ir**: -í, -iste, -ió, -imos, -isteis, -ieron.
hablé, hablaste, habló… / comí, comiste, comió…
• Ayer trabajé mucho. • El sábado comimos en un restaurante.
Pisownia w 1. os.: -car → **-qué** (busqué), -gar → **-gué** (llegué), -zar → **-cé** (empecé).
Sygnały: ayer, anoche, el lunes pasado, hace dos días.`,"Wczoraj i przeszłość","anoche=wczoraj wieczorem;la semana pasada=w zeszłym tygodniu;hace=temu;ya=już;después=potem;antes=wcześniej;primero=najpierw;luego=następnie;llegar=przybywać;terminar=kończyć;empezar=zaczynać;perder=gubić / tracić"],
["Fin de semana","Pretérito: ser, ir, hacer, tener…",`Nieregularne: **ser / ir**: fui, fuiste, fue, fuimos, fuisteis, fueron (te same!). **hacer**: hice, hiciste, hizo, hicimos, hicisteis, hicieron. **tener**: tuve… **estar**: estuve… **poder**: pude… **venir**: vine… **decir**: dije… **dar**: di, diste, dio… **ver**: vi, viste, vio…
• Fui a Madrid. • ¿Qué hiciste el domingo? • Estuvimos en la playa.
„Fue” = był/a albo poszedł/poszła — rozstrzyga kontekst.`,"Weekend i wakacje","el fin de semana=weekend;las vacaciones=wakacje;la playa=plaża;la montaña=góry;el viaje=podróż;la maleta=walizka;visitar=odwiedzać;descansar=odpoczywać;pasear=spacerować;nadar=pływać;sacar fotos=robić zdjęcia;divertirse=bawić się"],
["En el restaurante","Zaimki dopełnienia: lo, la, los, las",`Dopełnienie bliższe: me, te, **lo / la**, nos, os, **los / las**. Stoją **przed** czasownikiem: Lo compro. La veo. No los tengo. Przy bezokoliczniku mogą być doklejone: Quiero comprarlo.

• ¿Quieres el café? — Sí, lo quiero.`,"Restauracja","la carta/el menú=menu;el camarero=kelner;la propina=napiwek;pedir=prosić / zamawiać;recomendar=polecać;el plato=danie;el postre=deser;la ensalada=sałatka;el pescado=ryba;el vino=wino;una mesa para dos=stolik dla dwojga;la cuenta, por favor=rachunek poproszę;delicioso=pyszny;picante=ostry"],
["Mi rutina","Czasowniki zwrotne",`Zwrotne = czynność na sobie: **me, te, se, nos, os, se** + czasownik.

Zaimek stoi przed czasownikiem lub na końcu bezokolicznika: Voy a levantarme = Me voy a levantar.`,"Poranna rutyna","levantarse=wstawać;despertarse=budzić się;ducharse=brać prysznic;vestirse=ubierać się;acostarse=kłaść się spać;lavarse=myć się;peinarse=czesać się;desayunar=jeść śniadanie;almorzar=jeść obiad;cenar=jeść kolację;la mañana=ranek;la noche=noc"],
["Me gusta","Gustar, encantar, interesar",`**Gustar** zgadza się z tym, co się podoba, nie z osobą: me gusta **el café** (l.poj.), me gustan **los libros** (l.mn.). Osoba: me, te, le, nos, os, les.

["Cuando era niño","Pretérito imperfecto",`Imperfecto = opis, zwyczaj, tło w przeszłości. **-ar**: -aba, -abas, -aba, -ábamos, -abais, -aban. **-er/-ir**: -ía, -ías, -ía, -íamos, -íais, -ían.

["Érase una vez","Indefinido vs imperfecto",`**Imperfecto** = tło, opis, powtarzalność: Llovía y hacía frío. **Indefinido** = zdarzenie, które się wydarzyło: Entré y vi a Ana.

["Mis planes","Futuro simple",`Futuro = **bezokolicznik + -é, -ás, -á, -emos, -éis, -án**: hablaré, comerás, vivirá.

["De viaje","Por vs para",`**Para**: cel, odbiorca, termin, kierunek (Es para ti. Estudio para viajar. Salgo para Madrid.).

["Me gustaría…","Condicional (condicional simple)",`Condicional = **bezokolicznik + -ía, -ías, -ía, -íamos, -íais, -ían**; te same nieregularne rdzenie co w futuro (tendr-, har-, podr-…).

["Quiero que…","Presente de subjuntivo: formy",`Subjuntivo to tryb (życzenia, wątpliwości, emocje). Tworzenie: **yo w presente − o** + „odwrotne” końcówki: -ar → **-e, -es, -e, -emos, -éis, -en**; -er/-ir → **-a, -as, -a, -amos, -áis, -an**.

["Me alegro de que…","Subjuntivo: emocje i oceny",`Po wyrażeniach emocji i oceny + **que** + subjuntivo: me alegro de que, me molesta que, temo que, es una pena que, es raro que, me sorprende que.

["Creo que…","Indicativo vs subjuntivo",`**Pewność → indicativo**: creo que, pienso que, es verdad que, está claro que. **Wątpliwość / zaprzeczenie → subjuntivo**: no creo que, dudo que, no es verdad que, es posible que, quizás, tal vez.

["Ya había…","Pluscuamperfecto",`**había, habías, había, habíamos, habíais, habían + imiesłów** = czas zaprzeszły: coś, co zdarzyło się **przed** innym momentem w przeszłości.

  let local=null; try{local=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch{}
  let cloud=null;

    for(let attempt=0;attempt<2&&!cloud;attempt++){
      try{
        const snap=await withTimeout(DB.collection('data/users/'+UID).get(),12000);
        const docs={};snap.docs.forEach(d=>{docs[d.id]=d.data()});
        if(docs.core){
          const chunks=Object.keys(docs).filter(k=>k.startsWith('cards_')).sort((a,b)=>+a.split('_')[1]-+b.split('_')[1]);
          cloud={...docs.core,cards:chunks.flatMap(k=>docs[k].list||[]),chats:(docs.chat&&docs.chat.chats)||[]};

  if(cloud&&!cloud.empty&&prog(cloud)>=prog(local)){S={...defState(),...cloud};}
  else if(local&&(!cloud||cloud.empty||prog(local)>prog(cloud))){S={...defState(),...local}; if(DB){dirty.add('core');dirty.add('chat');for(let i=0;i*CH<S.cards.length;i++)dirty.add('cards_'+i)}}
  else S=defState();

function srsCalc(c,g){
  let ef=c.ef,iv=c.iv,rp=c.rp,nef=ef,niv,nrp;
  if(g===0){nrp=0;niv=0;nef=Math.max(1.3,ef-0.2)}
  else if(g===1){niv=rp===0?1:Math.max(iv+1,Math.round(iv*1.2));nef=Math.max(1.3,ef-0.15);nrp=rp+1}
  else if(g===2){niv=rp===0?1:rp===1?3:Math.max(iv+1,Math.round(iv*ef));nrp=rp+1}
  else {niv=rp===0?3:rp===1?6:Math.max(iv+2,Math.round(iv*ef*1.3));nef=ef+0.1;nrp=rp+1}
  return {ef:nef,iv:niv,rp:nrp};
}
function srsApply(c,g){const r=srsCalc(c,g);c.ef=r.ef;c.iv=r.iv;c.rp=r.rp;c.due=todayN()+r.iv;c.sn=(c.sn||0)+1;if(g===0)c.lp=(c.lp||0)+1;touchCard(c)}

  if(o.fd)c.fd=o.fd;
  S.cards.push(c);if(c.key)keyIdx[c.key]=c;touchCard(c);return c;
}
function addCardOnce(o){

  if(ex){ if(ex.x){ex.x=0;ex.due=todayN();ex.iv=0;ex.rp=0;touchCard(ex);return {c:ex,isNew:true}} return {c:ex,isNew:false} }
  return {c:newCard(o),isNew:true};
}

const norm=s=>String(s).toLowerCase().replace(/\(.*?\)/g,' ').replace(/[¿?¡!.,;:"“”«»…]/g,' ').replace(/\s+/g,' ').trim();
const fold=s=>s.replace(/ñ/g,'\u0001').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l').replace(/\u0001/g,'ñ');
const noArt=s=>s.replace(/^(el|la|los|las|un|una|unos|unas)\s+/,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tol=len=>len<=4?0:len<=8?1:len<=14?2:Math.floor(len*0.12);
const splitAlts=a=>String(a).replace(/\(.*?\)/g,' ').split('/').map(x=>x.trim()).filter(Boolean);
function judge(input,answers){
  const u=norm(input); if(!u) return {ok:false};
  const cands=[]; answers.forEach(a=>splitAlts(a).forEach(x=>{const n=norm(x);if(n){cands.push(n);const na=noArt(n);if(na!==n)cands.push(na)}}));
  if(cands.includes(u)||cands.includes(noArt(u))) return {ok:true};
  const fu=fold(u),fc=cands.map(fold);
  if(fc.includes(fu)||fc.includes(noArt(fu))) return {ok:true,note:'Uwaga na akcenty — poprawnie: '};
  for(const c of fc){ if(lev(fu,c)<=tol(c.length)||lev(noArt(fu),c)<=tol(c.length)) return {ok:true,note:'Drobna literówka — poprawnie: '}; }
  return {ok:false};
}
const hintOf=a=>{const s=splitAlts(a)[0]||'';return s.split(' ').map(w=>w[0]+'_'.repeat(Math.max(0,w.length-1))).join(' ')};

function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^es[-_]ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}catch{}}
function speak(t,rate){

function vocabSource(){ // zwraca [{es,pl,w}] zależnie od ustawienia puli
  if(S.settings.pool==='cards'){const a=activeCards().filter(c=>c.src!=='e'&&!/^(s|c):/.test(c.key||'')).map(c=>({es:c.es,pl:c.pl,w:0,id:c.key}));if(a.length>=6)return a}
  const w=curWeek();return VOC.filter(v=>v.w<=w);
}
function pickWords(n,focus){
  const w=curWeek(),pool=vocabSource(); if(!pool.length)return [];
  const near=pool.filter(v=>v.w>=w-2),out=[],seen=new Set();
  let guard=0;
  while(out.length<n&&guard++<200){
    const src=(focus||Math.random()<0.5)&&near.length?near:pool;
    const v=pick(src); if(!seen.has(v.es)){seen.add(v.es);out.push(v)}
    if(seen.size>=pool.length)break;
  }
  return out;
}
function distractors(v,dir,n=3){
  const w=curWeek(),pool=VOC.filter(x=>x.w<=Math.max(w,3)&&x.es!==v.es);
  const key=dir==='es-pl'?'pl':'es', out=[],seen=new Set([v[key]]);
  for(const x of shuffle(pool)){const t=x[key];if(!seen.has(t)){seen.add(t);out.push(t)}if(out.length>=n)break}
  return out;
}
const availVerbs=()=>VERBS.filter(v=>v[2]<=curWeek());
const availTenses=()=>TENSES.filter(t=>t.w<=curWeek());
function pickSentence(){const L=curLevel();const pool=SENT.filter(s=>s.lv<=L);const cur=pool.filter(s=>s.lv===L);return pick(Math.random()<0.6&&cur.length?cur:pool)}
function genQ(type,focus){
  if(type==='abcd'){const v=pickWords(1,focus)[0];if(!v)return null;const dir=Math.random()<0.5?'es-pl':'pl-es';
    const ans=dir==='es-pl'?v.pl:v.es, prompt=dir==='es-pl'?v.es:v.pl;
    return {t:'abcd',dir,prompt,ans,opts:shuffle([ans,...distractors(v,dir)]),w:v}}
  if(type==='pl-es'||type==='es-pl'){const v=pickWords(1,focus)[0];if(!v)return null;
    return type==='pl-es'?{t:'type',dir:'pl-es',prompt:v.pl,answers:[v.es],w:v,speak:false}:{t:'type',dir:'es-pl',prompt:v.es,answers:[v.pl],w:v,speak:true}}
  if(type==='gap'){const s=pickSentence();const L=curLevel();
    const others=shuffle(SENT.filter(x=>x!==s&&x.ans.toLowerCase()!==s.ans.toLowerCase())).slice(0,3).map(x=>x.ans);
    return {t:'gap',s,choice:L===1||Math.random()<0.4,opts:shuffle([s.ans,...others])}}
  if(type==='build'){const s=pickSentence();const toks=s.es.split(' ');if(toks.length<3)return genQ('build');return {t:'build',s,toks:shuffle(toks.map((w,i)=>({w,i})))}}
  if(type==='listen'){ if(curWeek()>=13&&Math.random()<0.5){const s=pickSentence();return {t:'listen',say:s.es,answers:[s.es],pl:s.pl,key:'s:'+fold(norm(s.es))}}
    const v=pickWords(1,focus)[0];if(!v)return null;return {t:'listen',say:v.es,answers:[v.es],pl:v.pl,w:v}}
  if(type==='conj'){const vs=availVerbs(),ts=availTenses();if(!vs.length)return null;
    const tn=pick(ts);const v=pick(vs.filter(x=>tn.k==='p'||x[2]>=0));const idx=rnd(6);const forms=conj(v[0],tn.k);
    return {t:'conj',inf:v[0],pl:v[1],tn,idx,ans:forms[idx]}}
  if(type==='pairs'){const ws=pickWords(5,focus);if(ws.length<4)return null;return {t:'pairs',pairs:ws}}
  return null;
}
function availTypes(){
  const t=['abcd','pl-es','es-pl','gap','build','pairs'];
  if(hasSpeech())t.push('listen');
  if(curWeek()>=2&&availVerbs().length)t.push('conj');
  return t;
}
function buildQuiz(n,types,focus){
  const ty=types||availTypes();const out=[];let i=0,guard=0;const order=shuffle(ty);
  while(out.length<n&&guard++<n*6){const q=genQ(order[i++%order.length],focus);if(q)out.push(q)}
  return out;
}
const QNAME={abcd:'ABCD','pl-es':'Tłumaczenie PL→ES','es-pl':'Tłumaczenie ES→PL',gap:'Luki w zdaniu',pairs:'Dopasuj pary',build:'Ułóż zdanie',conj:'Odmiana czasowników',listen:'Słuchanie'};

      g:b=>{const g=+b.dataset.g;srsApply(c,g);stat[g]++;q.shift();if(g===0)q.splice(Math.min(3,q.length),0,c);else done++;show()}

function errWord(w){return errCard({key:wkey(w),es:w.es,pl:w.pl,tg:['błąd'],src:'e'})}
function errSentence(s){const r=errCard({key:'s:'+fold(norm(s.es)),es:s.es,pl:s.pl,tg:['zdanie'],src:'e',fd:'pl-es'});r.c.fd='pl-es';return r}
function recQ(key,ok){const q=S.qs[key]||(S.qs[key]={n:0,ok:0});q.n++;if(ok)q.ok++;touch('core')}
const CHARS='áéíóúñü¿¡'.split('');
const inputRow=es=>`<input id="qin" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Wpisz odpowiedź…">${es?`<div class="chars">${CHARS.map(c=>`<button data-q="ch" data-c="${c}" type="button">${c}</button>`).join('')}</div>`:''}`;
function bindInput(ctx,check){const inp=$('#qin');if(!inp)return;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});setTimeout(()=>{try{inp.focus()}catch{}},50);
  ctx.map.ch=b=>{const s=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(inp.selectionEnd??s);inp.focus();const p=s+1;try{inp.setSelectionRange(p,p)}catch{}}}
const R={};

  ctx.body.innerHTML=`<div class="mut small">Wybierz tłumaczenie</div><div class="card fcard"><div class="big">${esc(q.prompt)}</div>${q.dir==='es-pl'?spk(q.w.es):''}</div><div class="opts">${q.opts.map(o=>`<button class="opt" data-q="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div><div id="fbx"></div>`;
  ctx.map.opt=b=>{const good=b.dataset.v===q.ans;$$('.opt',ctx.body).forEach(x=>{x.disabled=true;if(x.dataset.v===q.ans)x.classList.add('good')});if(!good)b.classList.add('wrong');ctx.done(good,good?'':`Poprawna odpowiedź: <b>${esc(q.ans)}</b>`)};

R.type=(q,ctx)=>{
  ctx.body.innerHTML=`<div class="mut small">${q.dir==='pl-es'?'Przetłumacz na hiszpański':'Przetłumacz na polski'}</div><div class="card fcard"><div class="big">${esc(q.prompt)}</div>${q.speak?spk(q.w.es):''}</div>${inputRow(q.dir==='pl-es')}
  <div class="row"><button class="btn ghost sm" data-q="hint">Podpowiedź</button><button class="btn ghost sm" data-q="idk">Nie wiem</button><span class="sp"></span><button class="btn pri" data-q="check">Sprawdź</button></div><div id="fbx"></div>`;
  const check=()=>{const v=$('#qin').value;if(!v.trim())return;const r=judge(v,q.answers);$('#qin').disabled=true;ctx.done(r.ok,r.ok?(r.note?`${r.note}<b>${esc(q.answers[0])}</b>`:(splitAlts(q.answers[0]).length>1?`Pełna odpowiedź: <b>${esc(q.answers[0])}</b>`:'')):`Poprawna odpowiedź: <b>${esc(q.answers[0])}</b>`)};

R.listen=(q,ctx)=>{
  ctx.body.innerHTML=`<div class="mut small">Posłuchaj i wpisz, co słyszysz</div><div class="card fcard"><button class="btn pri" data-q="play">▶ Odtwórz</button><button class="btn sm ghost" data-q="slow">Wolniej</button></div>${inputRow(true)}
  <div class="row"><button class="btn ghost sm" data-q="idk">Nie wiem</button><span class="sp"></span><button class="btn pri" data-q="check">Sprawdź</button></div><div id="fbx"></div>`;
  const check=()=>{const v=$('#qin').value;if(!v.trim())return;const r=judge(v,q.answers);$('#qin').disabled=true;ctx.done(r.ok,(r.ok?(r.note?`${r.note}<b>${esc(q.say)}</b><br>`:''):`Brzmiało: <b>${esc(q.say)}</b><br>`)+`<span class="mut">${esc(q.pl)}</span>`)};
  ctx.map.play=()=>speak(q.say);ctx.map.slow=()=>speak(q.say,0.6);ctx.map.check=check;
  ctx.map.idk=()=>{$('#qin').disabled=true;ctx.done(false,`Brzmiało: <b>${esc(q.say)}</b><br><span class="mut">${esc(q.pl)}</span>`)};
  bindInput(ctx,check);setTimeout(()=>speak(q.say),300);

R.gap=(q,ctx)=>{
  const s=q.s;
  ctx.body.innerHTML=`<div class="mut small">Uzupełnij lukę</div><div class="card fcard"><div class="big" style="font-size:22px">${esc(s.before)}<span class="acc">_____</span>${esc(s.after)}</div><div class="mut">${esc(s.pl)}</div></div>
  ${q.choice?`<div class="opts">${q.opts.map(o=>`<button class="opt" data-q="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`:`${inputRow(true)}<div class="row"><button class="btn ghost sm" data-q="idk">Nie wiem</button><span class="sp"></span><button class="btn pri" data-q="check">Sprawdź</button></div>`}<div id="fbx"></div>`;
  const fb=(ok)=>ok?`<span class="mut">${esc(s.es)}</span>`:`Poprawnie: <b>${esc(s.es)}</b>`;
  ctx.map.opt=b=>{const good=b.dataset.v.toLowerCase()===s.ans.toLowerCase();$$('.opt',ctx.body).forEach(x=>{x.disabled=true;if(x.dataset.v.toLowerCase()===s.ans.toLowerCase())x.classList.add('good')});if(!good)b.classList.add('wrong');ctx.done(good,fb(good))};
  const check=()=>{const v=$('#qin').value;if(!v.trim())return;const r=judge(v,[s.ans]);$('#qin').disabled=true;ctx.done(r.ok,(r.ok&&r.note?r.note+'<b>'+esc(s.ans)+'</b><br>':'')+fb(r.ok))};
  ctx.map.check=check;ctx.map.idk=()=>{const i=$('#qin');if(i)i.disabled=true;ctx.done(false,fb(false))};

R.conj=(q,ctx)=>{
  ctx.body.innerHTML=`<div class="mut small">Wpisz formę czasownika</div><div class="card fcard"><div class="chip acc">${esc(q.tn.n)}</div><div class="big"><span class="acc">${esc(PRON[q.idx])}</span> + ${esc(q.inf)}</div><div class="mut">${esc(q.pl)}</div></div>${inputRow(true)}
  <div class="row"><button class="btn ghost sm" data-q="idk">Nie wiem</button><span class="sp"></span><button class="btn pri" data-q="check">Sprawdź</button></div><div id="fbx"></div>`;
  const check=()=>{const v=$('#qin').value.trim().toLowerCase();if(!v)return;$('#qin').disabled=true;const ok=v===q.ans;
    ctx.done(ok,ok?`<span class="mut">${esc(conj(q.inf,q.tn.k).map((f,i)=>PRON[i].split(' ')[0]+' '+f).join(' · '))}</span>`:(fold(v)===fold(q.ans)?'Sprawdź akcent! ':'')+`Poprawnie: <b>${esc(q.ans)}</b>`)};
  ctx.map.check=check;ctx.map.idk=()=>{$('#qin').disabled=true;ctx.done(false,`Poprawnie: <b>${esc(q.ans)}</b>`)};
  bindInput(ctx,check);
};
R.build=(q,ctx)=>{
  const placed=[];
  const paint=()=>{
    $('#slot').innerHTML=placed.map(i=>`<button class="tok" data-q="rm" data-i="${i}">${esc(q.toks.find(t=>t.i===i).w)}</button>`).join('');
    $('#pool').innerHTML=q.toks.filter(t=>!placed.includes(t.i)).map(t=>`<button class="tok" data-q="add" data-i="${t.i}">${esc(t.w)}</button>`).join('');
  };
  ctx.body.innerHTML=`<div class="mut small">Ułóż zdanie po hiszpańsku</div><div class="card fcard"><div class="big" style="font-size:22px">${esc(q.s.pl)}</div></div><div class="slot" id="slot"></div><div id="pool"></div>
  <div class="row"><button class="btn ghost sm" data-q="clr">Wyczyść</button><span class="sp"></span><button class="btn pri" data-q="check">Sprawdź</button></div><div id="fbx"></div>`;
  paint();
  ctx.map.add=b=>{placed.push(+b.dataset.i);paint()};ctx.map.rm=b=>{placed.splice(placed.indexOf(+b.dataset.i),1);paint()};ctx.map.clr=()=>{placed.length=0;paint()};
  ctx.map.check=()=>{if(placed.length!==q.toks.length){toast('Użyj wszystkich słów');return}
    const mine=placed.map(i=>q.toks.find(t=>t.i===i).w).join(' ');const ok=mine===q.s.es;
    ctx.done(ok,ok?'':`Poprawnie: <b>${esc(q.s.es)}</b>`)};
};
R.pairs=(q,ctx)=>{
  const n=q.pairs.length,left=shuffle(q.pairs.map((p,i)=>({i,t:p.es}))),right=shuffle(q.pairs.map((p,i)=>({i,t:p.pl})));
  let se=null,sp=null,hit=0,errs=0;
  ctx.body.innerHTML=`<div class="mut small">Dopasuj hiszpańskie słowa do polskich</div><div class="pairs"><div class="col" id="pe">${left.map(x=>`<button data-q="pe" data-s="e" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div><div class="col" id="pp">${right.map(x=>`<button data-q="pe" data-s="p" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div></div><div id="fbx"></div>`;
  ctx.map.pe=b=>{
    if(b.classList.contains('hit'))return;
    const side=b.dataset.s;
    $$(`[data-s="${side}"]`,ctx.body).forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');if(side==='e')se=b;else sp=b;
    if(se&&sp){
      const ok=se.dataset.i===sp.dataset.i,a=se,c=sp;se=sp=null;
      if(ok){a.classList.remove('sel');c.classList.remove('sel');a.classList.add('hit');c.classList.add('hit');hit++;
        if(hit===n)ctx.done(errs===0,errs?`Pomyłek: ${errs}`:'Bez pomyłek',true)}
      else{errs++;a.classList.add('miss');c.classList.add('miss');errWord(q.pairs[+a.dataset.i]);setTimeout(()=>{[a,c].forEach(x=>x.classList.remove('miss','sel'))},450)}
    }
  };
};
function runQuiz(qs,opt={}){
  const ov=openOv({onCancel:()=>{}});let i=0,ok=0,wrongList=[],added=0;
  function next(){
    if(i>=qs.length)return fin();
    const q=qs[i];ov.bar(i/qs.length);ov.cnt(`${i+1}/${qs.length}`);
    ov.body.innerHTML='<div id="qarea" class="col"></div><div id="qfb" class="col"></div>';
    const area=$('#qarea'),ctx={body:area,map:{},locked:false,done(correct,html,skip){
      if(ctx.locked)return;ctx.locked=true;
      const key=q.t==='type'?q.dir:q.t;recQ(key,correct);
      if(correct)ok++;else{wrongList.push(q);if(!skip){const r=onWrong(q);if(r&&r.isNew)added++}}
      $('#qfb').innerHTML=`<div class="fb ${correct?'good':'wrong'}"><b>${correct?'Dobrze!':'Niepoprawnie.'}</b> ${html||''}${!correct?'<div class="tiny mut" style="margin-top:4px">Dodano do fiszek do powtórki.</div>':''}</div><button class="btn pri full" data-q="next">${i+1<qs.length?'Dalej':'Zobacz wynik'}</button>`;
      ctx.map.next=()=>{i++;next()};
      window.scrollTo(0,document.body.scrollHeight);$('#ov').scrollTo?.(0,$('#ov').scrollHeight);
    }};
    R[q.t](q,ctx);
    // jedno delegowanie na całość
    ov.body.onclick=e=>{const b=e.target.closest('[data-q]');if(!b||b.disabled)return;const f=ctx.map[b.dataset.q];if(f)f(b,e)};
  }
  function onWrong(q){
    if(q.t==='abcd'||q.t==='type')return errWord(q.w);
    if(q.t==='listen')return q.w?errWord(q.w):errSentence({es:q.say,pl:q.pl});
    if(q.t==='gap'||q.t==='build')return errSentence(q.s);
    if(q.t==='conj')return errCard({key:`c:${q.inf}:${q.tn.k}:${q.idx}`,es:q.ans,pl:`${PRON[q.idx]} + ${q.inf} (${q.tn.n})`,tg:['odmiana'],src:'e',fd:'pl-es'});
  }
  function fin(){
    ov.bar(1);ov.cnt('');
    S.qlog.push({d:todayS(),k:opt.kind||'mix',ok,n:qs.length,w:curWeek()});if(S.qlog.length>300)S.qlog=S.qlog.slice(-300);touch('core');
    const pct=Math.round(ok/qs.length*100);
    ov.body.onclick=null;
    ov.body.innerHTML=`<div class="card col" style="align-items:center;text-align:center"><h2>Wynik: ${ok}/${qs.length} (${pct}%)</h2><p class="${pct>=70?'ok':'bad'}">${pct>=85?'Świetnie!':pct>=70?'Dobrze, tak trzymaj.':'Dobra robota, że ćwiczysz błędy — wrócą w fiszkach.'}</p>${added?`<p class="small mut">Nowe fiszki z błędów: ${added}</p>`:''}</div>
      ${wrongList.length?`<div class="card col"><h3>Do poprawy</h3>${wrongList.slice(0,12).map(q=>`<div class="small">${esc(q.t==='abcd'||q.t==='type'?q.prompt+' → '+(q.ans||q.answers[0]):q.t==='gap'||q.t==='build'?q.s.es:q.t==='conj'?q.inf+' · '+q.tn.n+' → '+q.ans:q.t==='listen'?q.say:'pary słówek')}</div>`).join('')}</div>`:''}
      <button class="btn pri full" data-q="end">Zakończ</button>`;
    delegate(ov.body,{end:()=>{closeOv();opt.onDone&&opt.onDone({ok,n:qs.length});render()}});
  }
  next();
}

function runDialog(d){
  const ov=openOv();let me=1,showPl=true,pos=0;
  function pickRole(){
    ov.bar(0);ov.cnt('');
    ov.body.innerHTML=`<h2>${esc(d.t)}</h2><div class="mut">Wybierz swoją rolę. Kwestie partnera przeczytam na głos.</div>
    <button class="btn full" data-q="role" data-r="0">Gram: ${esc(d.roles[0])}</button><button class="btn full" data-q="role" data-r="1">Gram: ${esc(d.roles[1])}</button>
    <label class="row"><input type="checkbox" id="shpl" ${showPl?'checked':''} style="width:auto"> <span class="small">Pokazuj tłumaczenia</span></label>
    <details><summary>Podejrzyj cały dialog</summary><div class="dl" style="margin-top:8px">${d.lines.map(l=>`<div class="dline"><div class="who">${esc(d.roles[l[0]])}</div><div>${esc(l[1])}</div><div class="small mut">${esc(l[2])}</div></div>`).join('')}</div></details>`;
    delegate(ov.body,{role:b=>{me=+b.dataset.r;showPl=$('#shpl').checked;pos=0;step()}});
  }
  function step(){
    ov.bar(pos/d.lines.length);ov.cnt(`${Math.min(pos+1,d.lines.length)}/${d.lines.length}`);
    if(pos>=d.lines.length){
      S.dlg[d.id]=(S.dlg[d.id]||0)+1;touch('core');
      ov.body.innerHTML=`<div class="card col" style="align-items:center;text-align:center"><h2>Rozmówka przećwiczona</h2><p class="mut">Rola: ${esc(d.roles[me])}. Spróbuj teraz zagrać drugą rolę albo odegraj scenkę z Sofią.</p></div><button class="btn full" data-q="swap">Zagraj drugą rolę</button><button class="btn pri full" data-q="end">Zamknij</button>`;
      delegate(ov.body,{swap:()=>{me=1-me;pos=0;step()},end:()=>{closeOv();render()}});return;
    }
    const l=d.lines[pos],mine=l[0]===me;
    const hist=d.lines.slice(0,pos).map(x=>`<div class="dline ${x[0]===me?'me':''}"><div class="who">${esc(d.roles[x[0]])}</div><div>${esc(x[1])}</div>${showPl?`<div class="small mut">${esc(x[2])}</div>`:''}</div>`).join('');
    ov.body.innerHTML=`<div class="dl">${hist}</div>
    <div class="dline ${mine?'me':''}"><div class="who">${esc(d.roles[l[0]])}${mine?' · Twoja kwestia':''}</div>
      ${mine?`<div class="big" style="font-size:20px;text-align:left">${esc(l[2])}</div><div id="line" hidden><div style="color:var(--acc);font-size:18px;font-weight:600">${esc(l[1])}</div></div>`:`<div style="font-size:18px;font-weight:600">${esc(l[1])}</div>${showPl?`<div class="small mut">${esc(l[2])}</div>`:''}`}
    </div>
    <div class="row wrap">${hasSpeech()?`<button class="btn sm ghost" data-q="say">▶ Odsłuchaj</button>`:''}${mine?`<button class="btn sm ghost" data-q="reveal">Pokaż po hiszpańsku</button>`:''}<span class="sp"></span><button class="btn pri" data-q="next">${mine?'Powiedziałem/am — dalej':'Dalej'}</button></div>`;
    delegate(ov.body,{say:()=>speak(l[1]),reveal:b=>{$('#line').hidden=false;b.disabled=true},next:()=>{pos++;step()}});
    if(!mine)speak(l[1]);
    setTimeout(()=>{$('#ov').scrollTo?.(0,$('#ov').scrollHeight)},50);
  }
  pickRole();
}

let cFilter='all',cQuery='';

  <div class="card col"><div class="row"><div class="sp"><b style="font-size:22px">${due}</b> do powtórki<div class="small mut">${act.length} fiszek · ${matureCount()} utrwalonych</div></div><button class="btn pri" data-a="reviewAll" ${due?'':'disabled'}>Powtarzaj</button></div></div>
  <div class="card col"><h3>Dodaj własne słówko</h3>
    <label class="f">Hiszpański<input id="nes" autocomplete="off" autocapitalize="none" placeholder="np. la nevera"></label>

    <label class="f">Przykładowe zdanie (opcjonalnie)<input id="nex" autocomplete="off" placeholder="np. La leche está en la nevera."></label>

  <div class="card col"><h3>Zestawy startowe</h3><div class="small mut">Słówka z planu są dodawane do fiszek automatycznie w dni słownictwa. Tu możesz dodać cały poziom naraz.</div>
    ${decks.map(d=>`<div class="row"><div class="sp"><b>${LVN[d.lv]}</b> <span class="small mut">${d.total} słówek · w fiszkach: ${d.have}</span></div><button class="btn sm" data-a="adddeck" data-lv="${d.lv}" ${d.have>=d.total?'disabled':''}>Dodaj brakujące (${d.total-d.have})</button></div>`).join('')}</div>
  <div class="col"><div class="seg" id="cf">${[['all','Wszystkie'],['due','Do powtórki'],['own','Własne'],['err','Błędy']].map(([k,t])=>`<button data-a="cfilter" data-v="${k}" class="${cFilter===k?'on':''}">${t}</button>`).join('')}</div>
    <input id="csearch" placeholder="Szukaj…" value="${esc(cQuery)}" autocomplete="off"><div id="clist" class="col"></div></div>`;
  $('#csearch').addEventListener('input',e=>{cQuery=e.target.value;paintCards()});
  paintCards();
}
function paintCards(){
  const el=$('#clist');if(!el)return;const t=todayN();const q=fold(cQuery.toLowerCase());
  let a=activeCards();
  if(cFilter==='due')a=a.filter(c=>c.due<=t);else if(cFilter==='own')a=a.filter(c=>c.src==='o'||c.src==='h');else if(cFilter==='err')a=a.filter(c=>c.src==='e');
  if(q)a=a.filter(c=>fold((c.es+' '+c.pl+' '+(c.tg||[]).join(' ')).toLowerCase()).includes(q));
  a=a.sort((x,y)=>x.due-y.due||y.id-x.id);
  const shown=a.slice(0,80);
  el.innerHTML=shown.length?shown.map(c=>`<div class="row"><button class="crow" data-a="editcard" data-i="${c.id}"><div class="t"><b>${esc(c.es)}</b><div class="small mut">${esc(c.pl)}</div></div><div class="tiny ${c.due<=t?'acc':'mut'}">${c.due<=t?'do powtórki':'za '+fmtIv(c.due-t)}</div></button>${hasSpeech()?`<button class="btn sm ghost" data-a="spk" data-t="${esc(c.es)}" aria-label="Odsłuchaj">▶</button>`:''}</div>`).join('')+(a.length>80?`<div class="small mut">Pokazano 80 z ${a.length}. Zawęź wyszukiwanie.</div>`:''):'<div class="card mut">Brak fiszek w tym widoku.</div>';
}
A.cfilter=b=>{cFilter=b.dataset.v;$$('#cf button').forEach(x=>x.classList.toggle('on',x.dataset.v===cFilter));paintCards()};
A.reviewAll=()=>{const list=dueCards().sort((a,b)=>a.due-b.due||Math.random()-.5);if(list.length)runReview(list.slice(0,60))};
A.adddeck=b=>{const lv=+b.dataset.lv;let n=0;VOC.filter(v=>levelOfWeek(v.w)===lv).forEach(v=>{if(addVocabCard(v).isNew)n++});toast(`Dodano ${n} fiszek`);render()};
A.addcard=()=>{
  const es=$('#nes').value.trim(),pl=$('#npl').value.trim();if(!es||!pl){toast('Wpisz hiszpański i polski');return}
  const key='o:'+fold(norm(es)),ex=keyIdx[key];
  if(ex&&!ex.x){toast('Masz już tę fiszkę');return}
  const tg=$('#ntg').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
  const r=addCardOnce({key,es,pl,ex:$('#nex').value.trim(),tg,src:'o'});if(!r.isNew)return;
  const c=r.c;c.es=es;c.pl=pl;c.ex=$('#nex').value.trim();c.tg=tg;c.src='o';touchCard(c);
  toast('Dodano fiszkę');render();
};

  const t=todayN(),dow=(new Date().getDay()+6)%7,end=t+(6-dow),weeks=26,start=end-weeks*7+1;
  let h='';
  for(let n=start;n<=end;n++){const s=fromDnum(n),r=S.days[s],min=r?r.sec/60:0;
    const cls=n>t?'f':(!r||min<=0&&!r.n)?'':min<10?'l1':min<20?'l2':min<30?'l3':'l4';
    h+=`<button class="hc ${cls} ${r?.n>0?'dn':''} ${n===t?'td':''}" data-a="hmday" data-d="${s}" aria-label="${s}"></button>`;}
  return `<div class="scroll-x" id="hmwrap"><div class="hm">${h}</div></div><div class="small mut" id="hmInfo">Dotknij kwadracika, żeby zobaczyć dzień. Obwódka = zaliczony dzień planu.</div>`;
}
A.hmday=b=>{const s=b.dataset.d,r=S.days[s];$('#hmInfo').textContent=`${fmtDate(s)}: ${r?fmtMin(r.sec||0)+(r.n>0?` · zaliczono ${r.n}× (dzień planu)`:' · bez zaliczonego dnia'):'brak aktywności'}`};

const START_META='(Rozpocznij rozmowę: przywitaj się krótko jako Sofia i zadaj pierwsze proste pytanie dopasowane do poziomu. W polu korekta ustaw ok=true, bledy=[] i poprawione="".)';

function newChat(mode,scene){const c={id:Date.now(),ts:Date.now(),mode:mode||'free',scene:scene||'cafe',lvl:curLevel(),msgs:[]};S.chats.push(c);curChatId=c.id;touch('chat');return c}
function sofiaSystem(chat){
  const L=LVN[chat.lvl||curLevel()],w=curWeek();
  const gram=WEEKS.slice(Math.max(0,w-6),w).map(x=>x[1]).join('; ');
  const len={A1:'1–2 bardzo krótkie zdania, najprostsze słownictwo, presente',A2:'2–3 krótkie zdania; pretérito i futuro są OK',B1:'3–4 zdania; możesz używać subjuntivo i condicional',B2:'4–6 zdań, naturalny język, idiomy mile widziane'}[L];
  const mode=chat.mode==='strict'?'TRYB OSTRY: poprawiaj WSZYSTKIE błędy (gramatyka, rodzaj, zgodność, akcenty, interpunkcja ¿ ¡, styl), do 6 pozycji w "bledy", każdą z krótkim wyjaśnieniem reguły.':'TRYB SWOBODNY: poprawiaj tylko najważniejsze błędy (maksymalnie 3), bądź wyrozumiała i ignoruj drobiazgi (wielkie litery, brak ¿).';
  const scene=chat.mode==='scene'?`SCENKA: ${(SCENES.find(s=>s.id===chat.scene)||SCENES[0]).d} Wejdź w rolę i prowadź sytuację krok po kroku, jak w prawdziwej rozmowie.`:'Rozmowa swobodna: pytaj o życie codzienne, plany, hobby, jedzenie, podróże, pracę.';
  return `Jesteś Sofią: Hiszpanką z Madrytu, luzacką, ciepłą i cierpliwą nauczycielką rozmowy. Rozmawiasz z Polakiem uczącym się hiszpańskiego. Jego poziom: ${L} (tydzień ${w} z 52 planu). Ostatnio ćwiczone tematy: ${gram}.
ZASADY:
- Pole "sofia" i "pytanie" piszesz po hiszpańsku, na poziomie ${L}: ${len}. Nie używaj struktur wyraźnie powyżej tego poziomu.
- Po polsku piszesz tylko w "dlaczego" i "pl". Jeśli uczeń prosi o polski albo wyraźnie się zaciął (np. pisze po polsku, "no sé", "?"), ustaw "pokaz_pl": true i w "sofia" daj krótką pomoc.
- Korekta dotyczy OSTATNIEJ wypowiedzi ucznia. "poprawione" = cała jego wypowiedź zapisana poprawnie. Jeśli napisał po polsku, "poprawione" = to samo po hiszpańsku, "bledy" puste, "ok": true.
- Jeśli wypowiedź jest poprawna: "ok": true, "bledy": [], "poprawione": "".
- Potem naturalna odpowiedź Sofii na treść (nie komentuj gramatyki w "sofia") i JEDNO pytanie podtrzymujące rozmowę w "pytanie".
- "pl": tłumaczenie "sofia" + "pytanie" na polski. "slowka": do 3 słów z Twojej odpowiedzi, które mogą być dla ucznia nowe (z tłumaczeniem), albo [].
- ${mode}
- ${scene}
FORMAT: odpowiadaj WYŁĄCZNIE jednym obiektem JSON, bez markdown i bez tekstu poza JSON:
{"korekta":{"ok":true,"poprawione":"","bledy":[{"bylo":"…","powinno":"…","dlaczego":"…"}]},"sofia":"…","pytanie":"…","pl":"…","pokaz_pl":false,"slowka":[{"es":"…","pl":"…"}]}`;
}
function turnsFor(chat){
  const t=[{role:'user',content:sofiaSystem(chat)}];
  chat.msgs.slice(-16).forEach(x=>{if(x.r==='u')t.push({role:'user',content:x.meta||x.t});else if(x.r==='s')t.push({role:'assistant',content:x.raw})});
  return t;
}

function msgHTML(m,mi){
  if(m.r==='u'){if(m.hid)return '';return `<div class="msg u">${esc(m.t)}</div>`}
  const k=m.k||{};let fix='';
  const errs=Array.isArray(k.bledy)?k.bledy:[];
  if(k.ok===false||errs.length||(k.poprawione&&k.ok!==true)){
    fix=`<div class="fix"><b>Korekta</b>${k.poprawione?`<div>→ <u>${esc(k.poprawione)}</u></div>`:''}${errs.length?`<ul>${errs.map(b=>`<li><s>${esc(b.bylo)}</s> → <u>${esc(b.powinno)}</u>${b.dlaczego?`<div class="mut">${esc(b.dlaczego)}</div>`:''}</li>`).join('')}</ul>`:''}</div>`;
  } else if(k.ok===true&&!m.first){fix=`<div class="fix okx small">✓ Bez błędów</div>`}
  const words=(m.w||[]).map((w,wi)=>{const c=keyIdx['h:'+fold(norm(w.es))];const has=c&&!c.x;return `<span class="wch">${esc(w.es)} — ${esc(w.pl)}<button data-a="addw" data-m="${mi}" data-w="${wi}" ${has?'disabled':''}>${has?'✓':'+ fiszka'}</button></span>`}).join('');
  return `<div class="msg s">${fix}<div>${esc(m.t)}</div>${m.q?`<div class="qq">${esc(m.q)}</div>`:''}<div class="row wrap">${spk((m.t+' '+(m.q||'')).trim())}</div>${m.pl?`<details ${m.sp?'open':''}><summary>Tłumaczenie</summary><div class="small">${esc(m.pl)}</div></details>`:''}${words?`<div>${words}</div>`:''}</div>`;
}
function paintChat(){
  const el=$('#msgs');if(!el)return;const chat=curChat(false);
  let h='';
  if(!chat||!chat.msgs.some(x=>!x.hid)&&!chat.msgs.length){h=`<div class="card col"><p class="mut">Sofia rozmawia z Tobą po hiszpańsku na Twoim poziomie. Po każdej wypowiedzi dostaniesz krótką korektę, odpowiedź i pytanie. Nowe słówka dodasz do fiszek jednym kliknięciem.</p><button class="btn pri" data-a="sstart" ${chatBusy?'disabled':''}>Zacznij rozmowę</button></div>`}
  else h=chat.msgs.map((m,i)=>msgHTML(m,i)).join('');
  if(chatBusy)h+='<div class="msg s typing">Sofia pisze…</div>';

  el.innerHTML=h;
  const b=$('[data-a="ssend"]');if(b)b.disabled=chatBusy;
}

  try{
    const obj=await SM.json(turnsFor(chat),{cache:false,modelTier:S.settings.fast?'quick':'default'});
    if(!obj||typeof obj!=='object'||!obj.sofia)throw {code:'invalid_json',text:JSON.stringify(obj||'')};
    const first=!chat.msgs.some(x=>x.r==='s');
    chat.msgs.push({r:'s',first,raw:JSON.stringify(obj),k:obj.korekta||null,t:String(obj.sofia||''),q:String(obj.pytanie||''),pl:String(obj.pl||''),sp:!!obj.pokaz_pl,
      w:(Array.isArray(obj.slowka)?obj.slowka:[]).slice(0,4).filter(x=>x&&x.es&&x.pl).map(x=>({es:String(x.es),pl:String(x.pl)}))});
    touch('chat');
    if(count&&GOAL){GOAL.got++;if(GOAL.got>=GOAL.need&&!dayRec().steps.sofia){markStep('sofia');toast('Rozmowa z Sofią zaliczona')}}
  }catch(e){
    const code=e&&e.code;
    if(code==='invalid_json'&&e.text){chat.msgs.push({r:'s',raw:e.text,k:null,t:e.text,q:'',pl:'',w:[]});touch('chat')}
    else chatErr={t:{not_granted:'Zezwól na użycie Claude\'a w tym artifacie, żeby rozmawiać z Sofią.',rate_limited:'Za dużo zapytań naraz lub limit użycia. Odczekaj chwilę i spróbuj ponownie.',sampling_disabled:'Claude jest niedostępny dla tego konta.',session_expired:'Sesja wygasła — zaloguj się ponownie w Claude.',refused:'Sofia odmówiła odpowiedzi na tę wiadomość. Spróbuj inaczej sformułować.',cancelled:'Anulowano.'}[code]||'Coś poszło nie tak po stronie Claude\'a. Spróbuj ponownie.',retry:!['not_granted','sampling_disabled','refused'].includes(code)};
  }finally{chatBusy=false;if(TAB==='sofia'){const keep=$('#chin')?.value;vSofia($('#main'));if(keep)$('#chin').value=keep;window.scrollTo(0,document.body.scrollHeight)}else updateHeader()}
}

// ====================== USTAWIENIA / BACKUP ======================
A.settings=()=>{
  const ov=openOv();ov.bar(0);ov.cnt('');
  const st=saveState,stat={ok:'zapisano w magazynie Claude',pend:'zapisuję…',err:'błąd zapisu w magazynie (ponawiam)',local:'tylko w tej przeglądarce'}[st];
  ov.body.innerHTML=`<h2>Ustawienia</h2>
  <div class="card col"><h3>Zapis</h3><div class="small">Stan: <b>${stat}</b></div><div class="small mut">Postęp zapisuje się w trwałym magazynie artifactu (db), a kopia lustrzana w przeglądarce. Dodatkowo rób co jakiś czas eksport JSON.</div>
    <div class="row wrap"><button class="btn sp" data-q="export">Pobierz kopię (JSON)</button><button class="btn sp" data-q="copyjson">Kopiuj JSON</button></div>
    <label class="f">Import z kopii — wklej JSON lub wybierz plik<textarea id="impTxt" rows="3" placeholder='{"app":"espanol-diario",…}'></textarea></label>
    <div class="row wrap"><input type="file" id="impFile" accept=".json,application/json" style="flex:1"><button class="btn sp" data-q="import">Wczytaj kopię</button></div></div>
  <div class="card col"><h3>Plan</h3><label class="f">Data startu planu<input type="date" id="sStart" value="${S.start}"></label><div class="small mut">Zmiana daty zmienia tylko to, czy jesteś „do przodu” czy „do tyłu”. Pozycja w planie zostaje.</div></div>
  <div class="card col"><h3>Fiszki i wymowa</h3>
    <label class="f">Kierunek fiszek<select id="sDir"><option value="mix" ${S.settings.dir==='mix'?'selected':''}>Mieszany</option><option value="es-pl" ${S.settings.dir==='es-pl'?'selected':''}>Hiszpański → polski</option><option value="pl-es" ${S.settings.dir==='pl-es'?'selected':''}>Polski → hiszpański</option></select></label>
    <label class="f">Tempo mowy<select id="sRate"><option value="0.7" ${S.settings.rate==0.7?'selected':''}>Wolno</option><option value="0.9" ${S.settings.rate==0.9?'selected':''}>Normalnie</option><option value="1.05" ${S.settings.rate==1.05?'selected':''}>Szybko</option></select></label>
    <label class="row"><input type="checkbox" id="sAuto" ${S.settings.auto?'checked':''} style="width:auto"><span class="small">Czytaj hiszpańskie słowo automatycznie</span></label>
    <button class="btn sm" data-q="voice" ${hasSpeech()?'':'disabled'}>Test głosu (es-ES)</button><div class="tiny mut">${hasSpeech()?(VOICE?'Głos: '+esc(VOICE.name):'Brak głosu hiszpańskiego — użyję domyślnego.'):'Synteza mowy niedostępna w tym widoku.'}</div></div>
  <div class="card col"><h3>Sofia</h3><label class="row"><input type="checkbox" id="sFast" ${S.settings.fast?'checked':''} style="width:auto"><span class="small">Szybsza Sofia (lżejszy model, krótszy czas odpowiedzi)</span></label></div>
  <div class="card col"><h3 class="bad">Strefa zagrożenia</h3><button class="btn" style="color:var(--bad)" data-q="reset">Usuń cały progres</button></div>
  <button class="btn pri full" data-q="save">Zapisz i zamknij</button>`;
  delegate(ov.body,{
    export:exportData,copyjson:async()=>{const t=exportText();try{await navigator.clipboard.writeText(t);toast('Skopiowano JSON')}catch{showExportModal(t)}},
    voice:()=>speak('Hola, soy tu voz en español. ¿Cómo estás?'),
    import:async()=>{
      let txt=$('#impTxt').value.trim();const f=$('#impFile').files[0];
      if(!txt&&f){try{txt=await f.text()}catch{toast('Nie mogę odczytać pliku');return}}
      if(!txt){toast('Wklej JSON albo wybierz plik');return}
      let p;try{p=JSON.parse(txt)}catch{toast('To nie jest poprawny JSON');return}
      const s=p&&p.state?p.state:p;
      if(!s||typeof s.planDay!=='number'||!Array.isArray(s.cards)){toast('Plik nie wygląda na kopię tej aplikacji');return}
      if(await confirmBox(`Zastąpić obecny progres kopią? Kopia: dzień planu ${s.planDay}/${ND}, ${s.cards.length} fiszek. Tej operacji nie da się cofnąć (zrób wcześniej eksport).`,'Zastąp',true)){
        await replaceAll(s);closeOv();toast(saveState==='err'?'Wczytano, ale zapis w magazynie się nie udał':'Wczytano kopię');
      }},
    reset:async()=>{if(await confirmBox('Usunąć CAŁY progres: plan, fiszki, rozmowy i statystyki? Najpierw zrób eksport, jeśli chcesz zachować kopię.','Usuń wszystko',true)&&await confirmBox('Na pewno? To jest nieodwracalne.','Tak, usuń',true)){
      try{localStorage.removeItem(LS_KEY)}catch{}await replaceAll(defState());closeOv();toast('Progres usunięty')}},
    save:()=>{
      const sd=$('#sStart').value;if(sd)S.start=sd;
      S.settings.dir=$('#sDir').value;S.settings.rate=+$('#sRate').value;S.settings.auto=$('#sAuto').checked;S.settings.fast=$('#sFast').checked;
      touch('core');closeOv();toast('Zapisano ustawienia')}
  });
};
const exportText=()=>JSON.stringify({app:'espanol-diario',v:1,exported:new Date().toISOString(),state:S});
function showExportModal(t){showModal(`<h2>Kopia zapasowa</h2><div class="small mut">Skopiuj cały tekst i zapisz go w pliku .json (np. w notatkach lub mailu do siebie).</div><textarea id="expTxt" rows="8" readonly>${esc(t)}</textarea><div class="row"><button class="btn ghost sp" data-m="close">Zamknij</button><button class="btn pri sp" data-m="sel">Zaznacz wszystko</button></div>`,b=>{if(b.dataset.m==='sel'){const e=$('#expTxt');e.focus();e.select()}else closeModal()})}
async function exportData(){
  const t=exportText();
  if(DLS){try{await DLS.save({filename:`espanol-backup-${todayS()}.json`,data:t});toast('Zapisano plik kopii');return}catch(e){if(e&&e.code==='declined')return}}
  showExportModal(t);
}

// ====================== START ======================
let lastAct=Date.now(),tickN=0;
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true,capture:true}));
setInterval(()=>{if(document.hidden||Date.now()-lastAct>45000)return;const d=dayRec();d.sec+=5;if(++tickN%6===0){touch('core');updateHeader()}},5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushNow()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f)f(b,e)});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(views[h]&&h!==TAB){TAB=h;render()}});
async function boot(){
  const cl=window.claude;
  if(cl&&typeof cl.use==='function'){
    cl.use('sample').then(s=>{SM=s;if(TAB==='sofia'&&$('#ov').hidden)render()}).catch(()=>{});
    cl.use('downloads').then(d=>{DLS=d}).catch(()=>{});
    try{
      const [db,user]=await Promise.race([Promise.all([cl.use('db'),cl.use('user')]),sleep(11000).then(()=>[null,null])]);
      if(db&&user){UID=await user.id();if(UID)DB=db}
    }catch{}
  }
  await loadAll();
  dirty.add('core');saveSoon();
  const h=location.hash.slice(1);TAB=views[h]?h:'today';
  render();
}
boot();

</script>
